# Podium hinter nginx – Ziel: /etc/nginx/liebler.d/podium.conf (schritte/einrichten.sh, gemeinsames Schema in liebler-nginx.sh).
# liebler.conf bindet alle Dateien aus /etc/nginx/liebler.d/ im HTTPS-Server-Block ein; jede App pflegt nur ihre eigene Datei.
#
# Bewusst OHNE nginx-Passwort: Studierende treten per QR-Code ohne Anmeldung bei. Der Dozentenbereich ist durch die
# Anmeldung in der App geschützt (Konten, Einladungslinks, Cookie SameSite=Strict, Sperre nach Fehlversuchen).
# Kestrel lauscht nur auf 127.0.0.1:5090; die Anwendung kennt die Pfad-Basis /podium (PathBase).

location = /podium { return 301 /podium/; }

location /podium/ {
    proxy_pass         http://127.0.0.1:5090;
    proxy_http_version 1.1;
    # SignalR (Live-Spiel) nutzt WebSockets – $connection_upgrade kommt aus liebler.conf
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection $connection_upgrade;
    proxy_set_header   Host $host;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host $host;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    # Antwort-Header größer als die Vorgabe (4–8 KB) zulassen: Anmelde-Cookies nach dem Hochschul-Login (SAML)
    proxy_buffer_size  16k;
    proxy_buffers      8 16k;
    proxy_busy_buffers_size 32k;
    # Quiz-Import (bis 10 MB) und eigene Musik (bis 4 × 30 MB je Upload)
    client_max_body_size 130m;
}

# Musik und 3D-Modelle ändern sich selten – im Browser zwischenspeichern
location ~ ^/podium/(music|models)/ {
    proxy_pass         http://127.0.0.1:5090;
    proxy_set_header   Host $host;
    proxy_set_header   X-Forwarded-Proto $scheme;
    expires 7d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options nosniff always;
}
